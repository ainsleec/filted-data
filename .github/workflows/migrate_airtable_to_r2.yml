name: Migrate Airtable Images to R2

# Manual trigger only — this is a one-off migration, not a scheduled job.
# Go to the Actions tab on GitHub → select this workflow → "Run workflow"
# to choose dry_run true/false and an optional record limit each time.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no uploads or Airtable changes)"
        type: boolean
        default: true
      limit_records:
        description: "Limit number of records (blank = all records)"
        type: string
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests boto3 Pillow

      - name: Run migration script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: "All Garments"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: "filted-images"
          R2_PUBLIC_URL: "https://pub-9b251a5e9a524f88a7f16e0f7838fd75.r2.dev"
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT_RECORDS: ${{ inputs.limit_records }}
        run: python scripts/migrate_airtable_to_r2.py
